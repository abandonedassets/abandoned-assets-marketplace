services:
  - type: web
    name: abandoned-assets-marketplace
    env: node
    buildCommand: npm install --include=dev && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /api/public/health
    envVars:
      - key: NITRO_PRESET
        value: node-server
      - key: NITRO_HOST
        value: 0.0.0.0
