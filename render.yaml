services:
  - type: cron
    name: morning-ledger-sweep
    runtime: node
    schedule: "0 13 * * *" # 09:00 ET daily
    buildCommand: "true"
    startCommand: curl -sf -X POST -H "Authorization: Bearer $CRON_SECRET" https://abandoned-assets-marketplace.onrender.com/api/public/cron/morning-ledger-sweep
    envVars:
      - key: CRON_SECRET
        sync: false
  - type: web
    name: abandoned-assets-marketplace
    runtime: node
    rootDir: .
    plan: starter
    buildCommand: RENDER=true npm install && npm run build
    startCommand: node dist/server/index.mjs
    healthCheckPath: /api/public/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NITRO_PRESET
        value: node-server
      - key: NITRO_HOST
        value: "0.0.0.0"
      - key: PUBLIC_APP_URL
        value: https://abandoned-assets-marketplace.onrender.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: BLUEVINE_WEBHOOK_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: TITLE_WEBHOOK_SECRET
        sync: false
      - key: AUTO_PAYOUT_ON_CLEAR
        value: "true"
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SUPABASE_PROJECT_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
