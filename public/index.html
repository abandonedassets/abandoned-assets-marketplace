<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juggernaut Terminal</title>
    <style>
        body { background: #080f1d; color: #ffffff; font-family: 'Courier New', monospace; padding: 20px; }
        .card { border: 1px solid #1f2937; padding: 15px; margin-bottom: 10px; background: #111827; border-radius: 4px; }
        h1 { color: #3b82f6; }
        .error { color: #ef4444; }
    </style>
</head>
<body>
    <h1>Juggernaut Terminal</h1>
    <div id="status">Connecting...</div>
    <div id="grid"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // REPLACE WITH YOUR ACTUAL KEYS
        const SUPABASE_URL = "https://midneoocykeoquxkjkrj.supabase.co";
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY_HERE";

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function initTerminal() {
            const grid = document.getElementById('grid');
            const status = document.getElementById('status');
            
            try {
                const { data, error } = await supabase.from('assets').select('*');
                if (error) throw error;
                
                status.innerText = "Connection Established.";
                grid.innerHTML = data.length > 0 ? data.map(asset => `
                    <div class="card">
                        <h3>${asset.address || 'Unnamed Asset'}</h3>
                        <p>Basis: $${Number(asset.cost_basis || 0).toLocaleString()}</p>
                        <p>ARV: $${Number(asset.arv || 0).toLocaleString()}</p>
                        <p>Status: ${asset.status || 'Active'}</p>
                    </div>
                `).join('') : '<p>No assets found.</p>';
            } catch (err) {
                status.innerHTML = `<span class="error">Connection Failed: ${err.message}</span>`;
            }
        }

        initTerminal();
    </script>
</body>
</html>
