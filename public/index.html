<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Juggernaut Terminal</title>
    <!-- Load Supabase only once -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background:#080f1d; color:white; font-family:monospace; padding:20px;">
    <h1>Juggernaut Terminal</h1>
    <div id="status">Connecting...</div>
    <div id="grid"></div>

    <script>
        (function() {
            // Configuration
            const SUPABASE_URL = "https://midneoooykeoquxkjkrg.supabase.co";
            const SUPABASE_ANON_KEY = "sb_publishable_wH2in1zbqd1jNggdbNT5iQ_1BiDXzLd";

            // Initialize safely inside this function
            const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            async function init() {
                const status = document.getElementById('status');
                const grid = document.getElementById('grid');
                
                try {
                    const { data, error } = await client.from('deals_master').select('*');
                    if (error) throw error;
                    
                    status.innerText = "Connection Established.";
                    if (!data || data.length === 0) {
                        grid.innerHTML = "<p>No assets found.</p>";
                        return;
                    }

                    grid.innerHTML = data.map(asset => `
                        <div style="border:1px solid #333; padding:10px; margin-bottom:10px; background:#111;">
                            <h3>${asset.address || 'Unnamed'}</h3>
                            <p>Basis: $${(asset.cost_basis || 0).toLocaleString()}</p>
                            <p>ARV: $${(asset.arv_projection || 0).toLocaleString()}</p>
                        </div>
                    `).join('');
                } catch (e) {
                    status.innerHTML = `<p style="color:red;">Error: ${e.message}</p>`;
                }
            }
            init();
        })();
    </script>
</body>
</html>
