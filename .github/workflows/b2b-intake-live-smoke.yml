name: B2B intake live smoke test

on:
  push:
    branches: ["fix/b2b-intake-live-smoke"]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record existing health route status
        run: |
          status="$(curl --connect-timeout 5 --max-time 10 --silent --show-error --output /tmp/b2b-health.json --write-out '%{http_code}' 'https://abandoned-assets-marketplace.onrender.com/api/public/health' || true)"
          echo "Existing health route HTTP status: $status"
          cat /tmp/b2b-health.json || true
      - name: Verify intake page is live
        run: |
          for attempt in $(seq 1 6); do
            status="$(curl --connect-timeout 5 --max-time 10 --silent --show-error --output /tmp/b2b-page.html --write-out '%{http_code}' 'https://abandoned-assets-marketplace.onrender.com/api/public/b2b-intake-page' || true)"
            echo "Page attempt $attempt HTTP status: $status"
            if [ "$status" = "200" ] && grep -q 'B2B Corporate Debt Intake' /tmp/b2b-page.html; then
              echo "Intake page returned HTTP 200."
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "Intake page failed to become available; HTTP status: $status"
              exit 1
            fi
            sleep 5
          done
      - name: Verify private endpoint rejects unauthenticated requests
        run: |
          status="$(curl --connect-timeout 5 --max-time 10 --silent --show-error --output /tmp/b2b-api-response.json --write-out '%{http_code}' \
            --request POST 'https://abandoned-assets-marketplace.onrender.com/api/private/b2b-intake' \
            --header 'Content-Type: multipart/form-data; boundary=smoke' \
            --data-binary 'x')"
          test "$status" = "401"
          grep -q '"error":"AUTHENTICATION_REQUIRED"' /tmp/b2b-api-response.json
          echo "Private intake endpoint rejects unauthenticated requests."
