name: Juggernaut Keep-Alive
on:
  schedule:
    - cron: '*/10 * * * *' # Every 10 minutes
  workflow_dispatch: # Manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Institutional Ping
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://abandoned-assets-marketplace.onrender.com
          echo "Juggernaut is Awake and Operational."
