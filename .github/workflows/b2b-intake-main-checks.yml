name: B2B intake main-runtime checks

on:
  push:
    branches: ["fix/**", "main"]
    paths:
      - "server/api/private/b2b-intake.post.ts"
      - "server/api/public/b2b-intake-page.get.ts"
      - "server/client/src/pages/Home.tsx"
      - "package-lock.json"
      - "nitro.config.ts"
      - "disabled-server-routes/**"
      - "server/api/public/hooks/mercury-webhook.post.ts"
      - "server/api/public/hooks/stripe-settlement.post.ts"
      - ".github/workflows/b2b-intake-main-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/api/private/b2b-intake.post.ts"
      - "server/api/public/b2b-intake-page.get.ts"
      - "server/client/src/pages/Home.tsx"
      - "package-lock.json"
      - ".github/workflows/b2b-intake-main-checks.yml"

permissions:
  contents: read

concurrency:
  group: b2b-intake-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build current Render/Nitro application
        run: npm run build
      - name: Verify unreviewed webhook handlers are not bundled
        run: |
          test ! -f .output/server/chunks/routes/api/public/hooks/stripe-settlement.post.mjs
          test ! -f .output/server/chunks/routes/api/public/hooks/mercury-webhook.post.mjs
      - name: Smoke-test explicitly registered Nitro routes locally
        run: |
          SUPABASE_URL='https://example.supabase.co' \
          VITE_SUPABASE_ANON_KEY='ci-dummy-anon-key' \
          B2B_INTAKE_BRIDGE_PRIVATE_KEY_B64='ZHVtbXk=' \
          PORT=3000 node .output/server/index.mjs > /tmp/nitro.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          status="000"
          for attempt in $(seq 1 20); do
            status="$(curl --connect-timeout 1 --max-time 2 --silent --show-error --output /tmp/b2b-page.html --write-out '%{http_code}' 'http://127.0.0.1:3000/api/public/b2b-intake-page' || true)"
            if [ "$status" = "200" ]; then break; fi
            sleep 1
          done
          if [ "$status" != "200" ]; then
            echo "B2B intake page route returned HTTP $status"
            cat /tmp/nitro.log
            exit 1
          fi
          health_status="$(curl --connect-timeout 1 --max-time 2 --silent --show-error --output /tmp/health.json --write-out '%{http_code}' 'http://127.0.0.1:3000/api/public/health')"
          test "$health_status" = "200"
          mercury_status="$(curl --connect-timeout 1 --max-time 2 --silent --show-error --output /tmp/mercury.json --write-out '%{http_code}' 'http://127.0.0.1:3000/api/public/hooks/mercury-webhook')"
          test "$mercury_status" = "200"
          grep -q 'mercury-webhook-relay' /tmp/mercury.json
          grep -q 'B2B Corporate Debt Intake' /tmp/b2b-page.html
          api_status="$(curl --connect-timeout 1 --max-time 2 --silent --show-error --output /tmp/b2b-api.json --write-out '%{http_code}' --request POST 'http://127.0.0.1:3000/api/private/b2b-intake' --header 'Content-Type: multipart/form-data; boundary=smoke' --data-binary 'x')"
          echo "Unauthenticated intake route status: $api_status"
          test "$api_status" = "401"
          grep -q '"error":"AUTHENTICATION_REQUIRED"' /tmp/b2b-api.json
      - name: Verify live Edge Function rejects unsigned intake
        env:
          EDGE_URL: https://midneoocykeoquxkjkrg.supabase.co/functions/v1/asset-nav-b2b-debt-intake-v1
          EDGE_API_KEY: sb_publishable_wH2in1zbqd1jNggdbNT5iQ_1BiDXzLd
        run: |
          set -eu
          status="$(curl --connect-timeout 3 --max-time 15 --silent --show-error --output /tmp/edge-unsigned.json --write-out '%{http_code}' \
            --request POST "$EDGE_URL" \
            --header "apikey: $EDGE_API_KEY" \
            --header 'Authorization: Bearer b2b-bridge-v1' \
            --header 'Content-Type: multipart/form-data; boundary=smoke' \
            --data-binary 'x')"
          echo "Unsigned live Edge Function request: HTTP $status"
          test "$status" = "401"
          grep -q '"error":"BRIDGE_SIGNATURE_INVALID_OR_EXPIRED"' /tmp/edge-unsigned.json
      - name: Smoke-test deployed Render endpoints without creating records
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RENDER_BASE_URL: https://abandoned-assets-marketplace.onrender.com
        run: |
          set -eu
          get_status() {
            curl --connect-timeout 3 --max-time 10 --silent --show-error --output "$2" --write-out '%{http_code}' "$1"
          }
          page_status="$(get_status "$RENDER_BASE_URL/api/public/b2b-intake-page" /tmp/live-b2b-page.html)"
          echo "Live intake page: HTTP $page_status"
          test "$page_status" = "200"
          grep -q 'B2B Corporate Debt Intake' /tmp/live-b2b-page.html
          if ! grep -Eq 'const CONFIG = \{"url":"https://[^"]+","key":"[^"]+"\};' /tmp/live-b2b-page.html; then
            echo "Live intake page is missing its application Supabase URL or public key."
            exit 1
          fi
          health_status="$(get_status "$RENDER_BASE_URL/api/public/health" /tmp/live-health.json)"
          echo "Live health: HTTP $health_status"
          test "$health_status" = "200"
          mercury_status="$(get_status "$RENDER_BASE_URL/api/public/hooks/mercury-webhook" /tmp/live-mercury.json)"
          echo "Live Mercury GET probe: HTTP $mercury_status"
          test "$mercury_status" = "200"
          grep -q 'mercury-webhook-relay' /tmp/live-mercury.json
          intake_status="000"
          for attempt in $(seq 1 36); do
            intake_status="$(curl --connect-timeout 3 --max-time 10 --silent --show-error --output /tmp/live-intake.json --write-out '%{http_code}' --request POST "$RENDER_BASE_URL/api/private/b2b-intake" --header 'Content-Type: multipart/form-data; boundary=smoke' --data-binary 'x' || true)"
            echo "Live unauthenticated intake POST attempt $attempt: HTTP $intake_status"
            if [ "$intake_status" = "401" ]; then break; fi
            sleep 5
          done
          test "$intake_status" = "401"
          grep -q '"error":"AUTHENTICATION_REQUIRED"' /tmp/live-intake.json
          mercury_post_status="$(curl --connect-timeout 3 --max-time 10 --silent --show-error --output /tmp/live-mercury-post.json --write-out '%{http_code}' --request POST "$RENDER_BASE_URL/api/public/hooks/mercury-webhook" --header 'Content-Type: application/json' --data-binary '{}')"
          echo "Live Mercury POST (must not execute): HTTP $mercury_post_status"
          test "$mercury_post_status" = "404" -o "$mercury_post_status" = "405"
          stripe_post_status="$(curl --connect-timeout 3 --max-time 10 --silent --show-error --output /tmp/live-stripe-post.json --write-out '%{http_code}' --request POST "$RENDER_BASE_URL/api/public/hooks/stripe-settlement" --header 'Content-Type: application/json' --data-binary '{}')"
          echo "Live Stripe settlement POST (must not execute): HTTP $stripe_post_status"
          test "$stripe_post_status" = "404" -o "$stripe_post_status" = "405"
          echo "Live Render smoke tests passed: page=200 health=200 Mercury GET=200 intake POST=401 and financial POST handlers unavailable"
