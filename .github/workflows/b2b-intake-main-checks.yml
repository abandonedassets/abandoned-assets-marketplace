name: B2B intake main-runtime checks

on:
  push:
    branches: ["fix/b2b-intake-render-main"]
    paths:
      - "server/api/private/b2b-intake.post.ts"
      - "server/routes/b2b-intake.get.ts"
      - "server/client/src/pages/Home.tsx"
      - "package-lock.json"
      - ".github/workflows/b2b-intake-main-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/api/private/b2b-intake.post.ts"
      - "server/routes/b2b-intake.get.ts"
      - "server/client/src/pages/Home.tsx"
      - ".github/workflows/b2b-intake-main-checks.yml"

permissions:
  contents: read

concurrency:
  group: b2b-intake-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install locked dependencies
        run: npm install --no-audit --no-fund
      - name: Emit updated package-lock in chunks
        run: |
          node -e 'const fs=require("fs"); const b64=fs.readFileSync("package-lock.json").toString("base64"); for(let i=0;i<b64.length;i+=6000) console.log("PACKAGE_LOCK_CHUNK:"+String(i/6000).padStart(4,"0")+":"+b64.slice(i,i+6000))'
      - name: Build current Render/Nitro application
        run: npm run build
