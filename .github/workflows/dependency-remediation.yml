name: Prepare safe npm audit remediation PR

on:
  push:
    branches:
      - "chore/dependabot-security-updates"
    paths:
      - ".github/workflows/dependency-remediation.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: npm-audit-remediation
  cancel-in-progress: false

jobs:
  prepare-remediation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout production baseline
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install baseline lockfile
        run: npm ci

      - name: Apply compatible audit fixes only
        shell: bash
        run: |
          set +e
          npm audit fix
          fix_status=$?
          set -e
          echo "npm audit fix exit status: $fix_status"
          if git diff --quiet -- package-lock.json; then
            echo "No compatible lockfile changes were produced."
          fi

      - name: Verify reproducible clean install
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Report remaining vulnerabilities
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/npm-audit-after.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('/tmp/npm-audit-after.json', 'utf8'));
          const totals = report.metadata?.vulnerabilities ?? {};
          console.log('Post-fix npm audit totals:', JSON.stringify(totals));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              package: name,
              severity: item.severity,
              direct: item.isDirect,
              fixAvailable: item.fixAvailable
            }));
          }
          NODE
          audit_status=$?
          echo "Audit report collected. Remaining findings are recorded for review; no --force upgrade is permitted."
          exit 0

      - name: Open isolated pull request if lockfile changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "Compatible npm audit fix produced no package-lock changes; no PR created."
            exit 0
          fi
          git switch -c security/npm-audit-fix
          git add package-lock.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: apply compatible npm audit updates'
          git push origin security/npm-audit-fix
          gh pr create \
            --repo "$REPOSITORY" \
            --base main \
            --head security/npm-audit-fix \
            --title "fix: apply compatible npm audit updates" \
            --body "Automated, non-force npm audit remediation. The lockfile update was generated from main using `npm audit fix` without `--force`, followed by a clean `npm ci` and `npm run build`. Remaining audit findings, if any, are reported in the workflow log and require a separate compatibility-reviewed fix. This PR does not deploy or merge itself."
