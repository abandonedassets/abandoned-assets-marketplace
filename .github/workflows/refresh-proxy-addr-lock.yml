name: Refresh reviewed proxy-addr lockfile

on:
  push:
    branches: ["fix/proxy-addr-critical"]
    paths:
      - "package.json"
      - ".github/workflows/refresh-proxy-addr-lock.yml"

permissions:
  contents: write

concurrency:
  group: proxy-addr-lock-refresh
  cancel-in-progress: false

jobs:
  refresh-lock:
    if: github.ref == 'refs/heads/fix/proxy-addr-critical'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Regenerate lockfile without running lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Commit lockfile only if changed
        run: |
          set -eu
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock proxy-addr at patched 2.0.8"
          git push origin HEAD:fix/proxy-addr-critical
